<!doctype html><html><head><meta charset="utf-8"><title>Barge-in fixture</title>
<style>body{font:15px system-ui;max-width:640px;margin:24px auto}
label{display:block;margin-top:14px;font-weight:600}
input,select{font:inherit;padding:6px;width:100%;max-width:340px}
fieldset{margin-top:14px}</style>
</head><body>
<h1>Delivery details</h1>
<!--
  Phase 3 fixture. The FIRST field is a PIN/postal code - the PRD's own example
  of a prompt worth interrupting ("What's your PIN-") and a high-risk value that
  is always read back, so every barge-in run exercises prompt -> interruption ->
  stop -> ledger -> fill -> confirmation on one field, from a quiet start.
  The choice field that follows has six options so a cut-off list leaves
  options unheard. The third field only appears after the second is answered.
-->
<form id="f">
  <label for="postcode">Postal code</label>
  <input id="postcode" name="postcode" inputmode="numeric" required>

  <label for="dept">Department</label>
  <select id="dept" name="dept">
    <option value="">Please choose</option>
    <option value="card">Cardiology</option>
    <option value="derm">Dermatology</option>
    <option value="neur">Neurology</option>
    <option value="orth">Orthopaedics</option>
    <option value="paed">Paediatrics</option>
    <option value="radi">Radiology</option>
  </select>

  <div id="dependent" hidden>
    <label for="ref">Referral reference</label>
    <input id="ref" name="ref">
  </div>

  <label for="phone">Mobile number</label>
  <input id="phone" name="phone" type="tel">

  <label for="notes">Delivery notes</label>
  <input id="notes" name="notes">
</form>
<script>
  // A dependent field: appears once a department is chosen (PRD F4.1 shape).
  document.getElementById('dept').addEventListener('change', (e) => {
    document.getElementById('dependent').hidden = !e.target.value;
  });
  window.__formState = () => {
    const f = document.getElementById('f');
    return { postcode: f.postcode.value, dept: f.dept.value, ref: f.ref.value, phone: f.phone.value, notes: f.notes.value,
             dependentVisible: !document.getElementById('dependent').hidden };
  };
</script>
</body></html>
