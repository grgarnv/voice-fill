<!doctype html><html><head><meta charset="utf-8"><title>Clinic intake</title>
<style>body{font:15px system-ui;max-width:640px;margin:24px auto}
label{display:block;margin-top:14px;font-weight:600}
input,select{font:inherit;padding:6px;width:100%;max-width:340px}
fieldset{margin-top:14px}.err{color:#b00;display:none;font-size:13px;margin-top:4px}</style>
</head><body>
<h1>Clinic intake</h1>
<!--
  A realistic intake form for the Phase 2 exit criterion: one full form filled
  end to end by voice, with every high-risk field confirmed. It deliberately
  contains one field that REJECTS a plausible answer, so the validation and
  retry path is exercised rather than assumed.
-->
<form id="intake">
  <label for="fullname">Full name</label>
  <input id="fullname" name="fullname" required>

  <label for="dob">Date of birth</label>
  <input id="dob" name="dob" type="date" required>

  <label for="phone">Mobile number</label>
  <input id="phone" name="phone" type="tel" required>

  <label for="postcode">Postal code</label>
  <input id="postcode" name="postcode" required>

  <label for="nhs">Patient ID number</label>
  <input id="nhs" name="nhs" required>
  <div class="err" id="nhs-err">Patient ID must start with two letters</div>

  <label for="email">Email address</label>
  <input id="email" name="email" type="email">

  <fieldset>
    <legend>Preferred contact method</legend>
    <label style="font-weight:400"><input type="radio" name="contact" value="email"> Email</label>
    <label style="font-weight:400"><input type="radio" name="contact" value="phone"> Phone</label>
    <label style="font-weight:400"><input type="radio" name="contact" value="post"> Post</label>
  </fieldset>

  <label for="dept">Department</label>
  <select id="dept" name="dept">
    <option value="">Please choose</option>
    <option value="card">Cardiology</option>
    <option value="derm">Dermatology</option>
    <option value="neur">Neurology</option>
    <option value="orth">Orthopaedics</option>
  </select>

  <fieldset>
    <legend>Access requirements</legend>
    <label style="font-weight:400"><input type="checkbox" name="access" value="wheel"> Wheelchair access</label>
    <label style="font-weight:400"><input type="checkbox" name="access" value="interp"> Interpreter</label>
    <label style="font-weight:400"><input type="checkbox" name="access" value="hearing"> Hearing loop</label>
  </fieldset>

  <label style="font-weight:400"><input type="checkbox" name="consent" required> I consent to being contacted</label>
</form>

<script>
  // The patient ID rejects anything not starting with two letters. A voice
  // session must hear the rejection, say it, and re-ask - not fill and move on.
  const nhs = document.getElementById('nhs');
  nhs.addEventListener('change', () => {
    const bad = nhs.value.length > 0 && !/^[A-Za-z]{2}/.test(nhs.value);
    document.getElementById('nhs-err').style.display = bad ? 'block' : 'none';
    nhs.setAttribute('aria-invalid', bad ? 'true' : 'false');
  });

  // Expose a snapshot so the harness asserts the FORM's state, not the session's
  // belief about it.
  window.__formState = () => {
    const f = document.getElementById('intake');
    const radio = f.querySelector('input[name=contact]:checked');
    return {
      fullname: f.fullname.value,
      dob: f.dob.value,
      phone: f.phone.value,
      postcode: f.postcode.value,
      nhs: f.nhs.value,
      email: f.email.value,
      contact: radio ? radio.value : '',
      dept: f.dept.value,
      access: [...f.querySelectorAll('input[name=access]:checked')].map(x => x.value),
      consent: f.consent.checked,
    };
  };
</script>
</body></html>
